{% extends "base.html" %}
{% block content %}
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
        <h2 style="color: #cc0000; font-family: 'Merriweather', serif;">Dasbor Redaksi</h2>
        <div style="display: flex; gap: 10px;">
            <a href="/refresh" style="background: #00aa44; color: #fff; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 13px;">🔄 TARIK BERITA</a>
            <a href="/admin/tambah" style="background: #cc0000; color: #fff; padding: 10px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 13px;">+ Tulis Berita</a>
        </div>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Judul</th><th>Kategori</th><th>Jenis</th><th>Aksi</th></tr></thead>
        <tbody>
            {% for a in articles %}
            <tr>
                <td>{{ a.id }}</td>
                <td style="font-weight:600;">{{ a.title[:40] }}...</td>
                <td>{{ a.category }}</td>
                <td>{% if a.is_auto %}<span style="color:#0066cc; font-weight:bold;">AUTO</span>{% else %}<span style="color:#009944; font-weight:bold;">REDAKSI</span>{% endif %}</td>
                <td><a href="/admin/hapus/{{ a.id }}" style="color:#cc0000; font-weight: bold; text-decoration:none;" onclick="return confirm('Hapus?')">Hapus</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
