{% extends "base.html" %}
{% block content %}
    <h2 style="margin-bottom: 20px; color:#cc0000;">Tulis Berita Baru</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label>Judul Berita</label>
            <input type="text" name="title" required placeholder="Contoh: Kasus Korupsi Dana Desa...">
        </div>
        <div class="form-group" style="display:flex; gap:15px;">
            <div style="flex:1;">
                <label>Kategori</label>
                <select name="category">
                    <option value="NASIONAL">NASIONAL</option>
                    <option value="HUKUM">HUKUM</option>
                    <option value="KORUPSI">KORUPSI</option>
                    <option value="KRIMINAL">KRIMINAL</option>
                    <option value="DAERAH">DAERAH</option>
                </select>
            </div>
            <div style="flex:1;">
                <label>Penulis</label>
                <input type="text" name="author" required value="Tim Redaksi">
            </div>
        </div>
        <div class="form-group">
            <label>Upload Gambar (dari Galeri HP)</label>
            <input type="file" name="image_file" accept="image/*" style="padding: 8px; background: #f9f9f9;">
            <small style="color:#888; font-size:11px;">Format: JPG, PNG, WEBP (Maks 5MB)</small>
        </div>
        <div class="form-group">
            <label>Isi Berita</label>
            <textarea name="content" rows="12" required placeholder="Tulis isi berita..."></textarea>
        </div>
        <button type="submit" class="btn">TERBITKAN BERITA</button>
    </form>
{% endblock %}
